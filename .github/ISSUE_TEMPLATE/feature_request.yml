name: Feature Request
description: Suggest an improvement for MiSTer Companion
title: "[FEATURE] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Have an idea that could improve MiSTer Companion? Keep the request focused and explain how it would help users.

        Please search both open and closed issues before submitting to make sure the same feature has not already been requested or discussed.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Desktop
        - Mobile
        - Desktop and Mobile
    validations:
      required: true

  - type: textarea
    id: feature
    attributes:
      label: Feature Description
      description: What would you like to be added or changed?
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why Is This Useful?
      description: What problem would this solve or what would it improve?
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Suggested Behavior
      description: Briefly explain how you imagine the feature working.

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Add mockups, screenshots, examples, or relevant links.

  - type: checkboxes
    id: checks
    attributes:
      label: Existing Issues
      description: Before submitting, please search both open and closed issues to make sure this feature has not already been requested or discussed.
      options:
        - label: I have searched both open and closed issues and did not find an existing request that matches this feature.
          required: true
