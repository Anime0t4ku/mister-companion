name: Desktop Bug Report
description: Report a problem with MiSTer Companion Desktop
title: "[DESKTOP BUG] "
labels:
  - bug
  - desktop
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a MiSTer Companion Desktop issue.

        Please make sure you are using the latest available release and search both open and closed issues before submitting.

  - type: input
    id: version
    attributes:
      label: MiSTer Companion Version
      description: Which Desktop version are you using?
      placeholder: e.g. v7.5.3
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Select the platform you are using MiSTer Companion on.
      options:
        - Windows x64
        - Windows ARM64
        - macOS Apple Silicon
        - macOS Intel
        - Linux x64
        - Linux ARM64
    validations:
      required: true

  - type: dropdown
    id: installation_type
    attributes:
      label: How are you running MiSTer Companion?
      options:
        - Official packaged release
        - From source
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Issue
      description: Explain the problem clearly and include any important context.
      placeholder: What problem are you experiencing?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide the exact steps needed to reproduce the issue.
      placeholder: |
        1. Open MiSTer Companion
        2. ...
        3. ...
        4. The issue occurs
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: usage_type
    attributes:
      label: How were you using Companion when the issue occurred?
      options:
        - Connected to MiSTer
        - Offline SD card
        - Local PC files
        - Not applicable
    validations:
      required: true

  - type: dropdown
    id: regression
    attributes:
      label: Did this work in an earlier MiSTer Companion version?
      options:
        - "Yes"
        - "No"
        - Not sure
    validations:
      required: true

  - type: input
    id: last_working_version
    attributes:
      label: Last Known Working Version
      description: If this worked in an earlier version, enter the last version you know worked correctly.
      placeholder: e.g. v7.5.2

  - type: textarea
    id: diagnostics
    attributes:
      label: Screenshots, Logs, or Error Messages
      description: Add any screenshots, logs, or error messages that may help. Remove private information first.

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Add any other details that may be useful.

  - type: checkboxes
    id: checks
    attributes:
      label: Existing Issues
      description: Before submitting, please search both open and closed issues to make sure this problem has not already been reported or resolved.
      options:
        - label: I have searched both open and closed issues and did not find an existing report that matches this issue.
          required: true
