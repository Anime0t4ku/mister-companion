name: Mobile Bug Report
description: Report a problem with MiSTer Companion Mobile
title: "[MOBILE BUG] "
labels:
  - bug
  - mobile
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a MiSTer Companion Mobile issue.

        Please make sure you are using the latest available release and search both open and closed issues before submitting.

  - type: input
    id: version
    attributes:
      label: MiSTer Companion Mobile Version
      description: Which Mobile version are you using?
      placeholder: e.g. v4.0.1
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Android Device
      description: Enter the manufacturer and model of your Android device.
      placeholder: e.g. Samsung Galaxy S25
    validations:
      required: true

  - type: input
    id: android_version
    attributes:
      label: Android Version
      placeholder: e.g. Android 16
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Issue
      description: Explain the problem clearly and include any important context.
      placeholder: What problem are you experiencing?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide the exact steps needed to reproduce the issue.
      placeholder: |
        1. Open MiSTer Companion Mobile
        2. ...
        3. ...
        4. The issue occurs
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: connection_state
    attributes:
      label: Connection State When the Issue Occurred
      options:
        - Connected to MiSTer
        - Disconnected from MiSTer
        - Not applicable
    validations:
      required: true

  - type: dropdown
    id: regression
    attributes:
      label: Did this work in an earlier MiSTer Companion Mobile version?
      options:
        - "Yes"
        - "No"
        - Not sure
    validations:
      required: true

  - type: input
    id: last_working_version
    attributes:
      label: Last Known Working Version
      description: If this worked in an earlier version, enter the last version you know worked correctly.
      placeholder: e.g. v4.0.0

  - type: textarea
    id: diagnostics
    attributes:
      label: Screenshots or Error Messages
      description: Add any screenshots or error messages that may help. Remove private information first.

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Add any other details that may be useful.

  - type: checkboxes
    id: checks
    attributes:
      label: Existing Issues
      description: Before submitting, please search both open and closed issues to make sure this problem has not already been reported or resolved.
      options:
        - label: I have searched both open and closed issues and did not find an existing report that matches this issue.
          required: true
