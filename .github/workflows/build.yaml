name: MiSTer-Companion

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:

  # ============================================================
  # Windows Builds (x86_64 + ARM64)
  # ============================================================
  build-windows:
    name: Build Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
          - arch: ARM64
            runner: windows-11-arm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Native Architecture
        shell: python
        run: |
          import platform
          print("Platform:", platform.platform())
          print("Machine:", platform.machine())

      - name: Install OpenSSL for Windows ARM64
        if: matrix.arch == 'ARM64'
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" install openssl:arm64-windows-static-md
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_TRIPLET=arm64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Dependencies
        working-directory: mister-companion
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt

      - name: Generate ScreenScraper private credentials
        working-directory: mister-companion
        shell: python
        env:
          SCREENSCRAPER: ${{ secrets.SCREENSCRAPER }}
        run: |
          import json
          import os
          from pathlib import Path

          secret = os.environ.get("SCREENSCRAPER", "").strip()
          target = Path("core/screenscraper_private.py")

          dev_id = ""
          dev_password = ""
          softname = "mister-companion"

          if secret:
              data = json.loads(secret)
              dev_id = data.get("dev_id", "")
              dev_password = data.get("dev_password", "")
              softname = data.get("softname", "mister-companion")

              if not dev_id or not dev_password or not softname:
                  raise SystemExit("SCREENSCRAPER secret is missing dev_id, dev_password, or softname")
          else:
              print("SCREENSCRAPER secret not available, building without ScreenScraper developer credentials.")

          target.write_text(
              "\n".join([
                  f"SS_DEV_ID = {dev_id!r}",
                  f"SS_DEV_PASSWORD = {dev_password!r}",
                  f"SS_SOFTNAME = {softname!r}",
                  "",
                  "",
                  "def has_dev_credentials():",
                  "    return bool(SS_DEV_ID and SS_DEV_PASSWORD and SS_SOFTNAME)",
                  "",
                  "",
                  "def get_dev_credentials():",
                  "    if not has_dev_credentials():",
                  "        return None",
                  "",
                  "    return {",
                  "        \"devid\": SS_DEV_ID,",
                  "        \"devpassword\": SS_DEV_PASSWORD,",
                  "        \"softname\": SS_SOFTNAME,",
                  "    }",
                  "",
              ]),
              encoding="utf-8",
          )

      - name: Build Executable
        working-directory: mister-companion
        run: pyinstaller --clean --onefile --windowed --icon app.ico --add-data "assets;assets" --name MiSTer-Companion main.py

      - name: Package Windows Build
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "mister-companion/dist/MiSTer-Companion.exe" `
            -DestinationPath "MiSTer-Companion-Windows-${{ matrix.arch }}.zip" `
            -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiSTer-Companion-Windows-${{ matrix.arch }}
          path: MiSTer-Companion-Windows-${{ matrix.arch }}.zip


  # ============================================================
  # Linux Builds (x86_64 + ARM64)
  # ============================================================
  build-linux:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: ARM64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Native Architecture
        run: |
          python -c "import platform; print(platform.platform()); print(platform.machine())"

      - name: Install Dependencies
        working-directory: mister-companion
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Generate ScreenScraper private credentials
        working-directory: mister-companion
        shell: python
        env:
          SCREENSCRAPER: ${{ secrets.SCREENSCRAPER }}
        run: |
          import json
          import os
          from pathlib import Path

          secret = os.environ.get("SCREENSCRAPER", "").strip()
          target = Path("core/screenscraper_private.py")

          dev_id = ""
          dev_password = ""
          softname = "mister-companion"

          if secret:
              data = json.loads(secret)
              dev_id = data.get("dev_id", "")
              dev_password = data.get("dev_password", "")
              softname = data.get("softname", "mister-companion")

              if not dev_id or not dev_password or not softname:
                  raise SystemExit("SCREENSCRAPER secret is missing dev_id, dev_password, or softname")
          else:
              print("SCREENSCRAPER secret not available, building without ScreenScraper developer credentials.")

          target.write_text(
              "\n".join([
                  f"SS_DEV_ID = {dev_id!r}",
                  f"SS_DEV_PASSWORD = {dev_password!r}",
                  f"SS_SOFTNAME = {softname!r}",
                  "",
                  "",
                  "def has_dev_credentials():",
                  "    return bool(SS_DEV_ID and SS_DEV_PASSWORD and SS_SOFTNAME)",
                  "",
                  "",
                  "def get_dev_credentials():",
                  "    if not has_dev_credentials():",
                  "        return None",
                  "",
                  "    return {",
                  "        \"devid\": SS_DEV_ID,",
                  "        \"devpassword\": SS_DEV_PASSWORD,",
                  "        \"softname\": SS_SOFTNAME,",
                  "    }",
                  "",
              ]),
              encoding="utf-8",
          )

      - name: Build Executable
        working-directory: mister-companion
        run: pyinstaller --clean --onefile --windowed --add-data "assets:assets" --name MiSTer-Companion main.py

      - name: Make Binary Executable
        run: chmod +x mister-companion/dist/MiSTer-Companion

      - name: Package Linux Build
        run: |
          tar -C mister-companion/dist -czvf "MiSTer-Companion-Linux-${{ matrix.arch }}.tar.gz" MiSTer-Companion

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiSTer-Companion-Linux-${{ matrix.arch }}
          path: MiSTer-Companion-Linux-${{ matrix.arch }}.tar.gz


  # ============================================================
  # macOS Builds (Apple Silicon + Intel)
  # ============================================================
  build-macos:
    name: Build macOS ${{ matrix.package_arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - package_arch: Apple-Silicon
            runner: macos-15
          - package_arch: Intel
            runner: macos-15-intel

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Native Architecture
        run: |
          python -c "import platform; print(platform.platform()); print(platform.machine())"

      - name: Install Dependencies (Apple Silicon)
        if: matrix.package_arch == 'Apple-Silicon'
        working-directory: mister-companion
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt

      - name: Install Dependencies (Intel)
        if: matrix.package_arch == 'Intel'
        working-directory: mister-companion
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir --force-reinstall \
            "cryptography==43.0.3" \
            "pyinstaller==6.11.1"

          python -m pip check
          python -c "import platform, ssl, cryptography; print('Architecture:', platform.machine()); print('Python OpenSSL:', ssl.OPENSSL_VERSION); print('cryptography:', cryptography.__version__)"
          python -c "import paramiko; print('paramiko:', paramiko.__version__)"

      - name: Generate ScreenScraper private credentials
        working-directory: mister-companion
        shell: python
        env:
          SCREENSCRAPER: ${{ secrets.SCREENSCRAPER }}
        run: |
          import json
          import os
          from pathlib import Path

          secret = os.environ.get("SCREENSCRAPER", "").strip()
          target = Path("core/screenscraper_private.py")

          dev_id = ""
          dev_password = ""
          softname = "mister-companion"

          if secret:
              data = json.loads(secret)
              dev_id = data.get("dev_id", "")
              dev_password = data.get("dev_password", "")
              softname = data.get("softname", "mister-companion")

              if not dev_id or not dev_password or not softname:
                  raise SystemExit("SCREENSCRAPER secret is missing dev_id, dev_password, or softname")
          else:
              print("SCREENSCRAPER secret not available, building without ScreenScraper developer credentials.")

          target.write_text(
              "\n".join([
                  f"SS_DEV_ID = {dev_id!r}",
                  f"SS_DEV_PASSWORD = {dev_password!r}",
                  f"SS_SOFTNAME = {softname!r}",
                  "",
                  "",
                  "def has_dev_credentials():",
                  "    return bool(SS_DEV_ID and SS_DEV_PASSWORD and SS_SOFTNAME)",
                  "",
                  "",
                  "def get_dev_credentials():",
                  "    if not has_dev_credentials():",
                  "        return None",
                  "",
                  "    return {",
                  "        \"devid\": SS_DEV_ID,",
                  "        \"devpassword\": SS_DEV_PASSWORD,",
                  "        \"softname\": SS_SOFTNAME,",
                  "    }",
                  "",
              ]),
              encoding="utf-8",
          )

      - name: Create macOS App Icon
        working-directory: mister-companion
        run: |
          mkdir -p build/app_icon.iconset
          sips -z 16 16 assets/icon.png --out build/app_icon.iconset/icon_16x16.png
          sips -z 32 32 assets/icon.png --out build/app_icon.iconset/icon_16x16@2x.png
          sips -z 32 32 assets/icon.png --out build/app_icon.iconset/icon_32x32.png
          sips -z 64 64 assets/icon.png --out build/app_icon.iconset/icon_32x32@2x.png
          sips -z 128 128 assets/icon.png --out build/app_icon.iconset/icon_128x128.png
          sips -z 256 256 assets/icon.png --out build/app_icon.iconset/icon_128x128@2x.png
          sips -z 256 256 assets/icon.png --out build/app_icon.iconset/icon_256x256.png
          sips -z 512 512 assets/icon.png --out build/app_icon.iconset/icon_256x256@2x.png
          sips -z 512 512 assets/icon.png --out build/app_icon.iconset/icon_512x512.png
          sips -z 1024 1024 assets/icon.png --out build/app_icon.iconset/icon_512x512@2x.png
          iconutil -c icns build/app_icon.iconset -o app.icns

      - name: Build App Bundle
        working-directory: mister-companion
        run: pyinstaller --clean --windowed --icon app.icns --add-data "assets:assets" --name MiSTer-Companion main.py

      - name: Verify Intel App Bundle
        if: matrix.package_arch == 'Intel'
        working-directory: mister-companion
        run: |
          APP="dist/MiSTer-Companion.app"
          MAIN="$APP/Contents/MacOS/MiSTer-Companion"
          RUST="$APP/Contents/Frameworks/cryptography/hazmat/bindings/_rust.abi3.so"

          echo "Main executable:"
          file "$MAIN"
          lipo -archs "$MAIN"

          echo "cryptography extension:"
          file "$RUST"
          lipo -archs "$RUST"
          otool -L "$RUST"

          if [ -f "$APP/Contents/Frameworks/libssl.3.dylib" ]; then
            echo "Bundled OpenSSL:"
            file "$APP/Contents/Frameworks/libssl.3.dylib"
            file "$APP/Contents/Frameworks/libcrypto.3.dylib"
            nm -gU "$APP/Contents/Frameworks/libssl.3.dylib" | grep '_SSL_get0_group_name'
          fi

      - name: Smoke Test Intel App Before Signing
        if: matrix.package_arch == 'Intel'
        working-directory: mister-companion
        run: |
          APP="dist/MiSTer-Companion.app"
          MAIN="$APP/Contents/MacOS/MiSTer-Companion"
          LOG="$RUNNER_TEMP/mister-companion-startup.log"

          "$MAIN" >"$LOG" 2>&1 &
          PID=$!
          sleep 8

          if kill -0 "$PID" 2>/dev/null; then
            kill "$PID" || true
            wait "$PID" 2>/dev/null || true
            echo "Application startup test passed."
          else
            wait "$PID" || true
            echo "Application failed during startup:"
            cat "$LOG"
            exit 1
          fi

      - name: Import Developer ID Certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer_id_application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Sign App Bundle
        working-directory: mister-companion
        run: |
          codesign --force --deep --options runtime --timestamp \
            --sign "Developer ID Application: Bjorn Logan (SMNGA44VUR)" \
            "dist/MiSTer-Companion.app"

          codesign --verify --deep --strict --verbose=2 "dist/MiSTer-Companion.app"

      - name: Create macOS DMG
        working-directory: mister-companion
        run: |
          mkdir -p dmg-root
          cp -R "dist/MiSTer-Companion.app" "dmg-root/"
          ln -s /Applications "dmg-root/Applications"
          hdiutil create \
            -volname "MiSTer Companion" \
            -srcfolder "dmg-root" \
            -ov \
            -format UDZO \
            "dist/MiSTer-Companion-macOS-${{ matrix.package_arch }}.dmg"

      - name: Sign macOS DMG
        working-directory: mister-companion
        run: |
          codesign --force --timestamp \
            --sign "Developer ID Application: Bjorn Logan (SMNGA44VUR)" \
            "dist/MiSTer-Companion-macOS-${{ matrix.package_arch }}.dmg"

          codesign --verify --verbose=2 "dist/MiSTer-Companion-macOS-${{ matrix.package_arch }}.dmg"

      - name: Notarize macOS DMG
        working-directory: mister-companion
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool submit "dist/MiSTer-Companion-macOS-${{ matrix.package_arch }}.dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait

      - name: Staple macOS DMG
        working-directory: mister-companion
        run: |
          xcrun stapler staple "dist/MiSTer-Companion-macOS-${{ matrix.package_arch }}.dmg"
          xcrun stapler validate "dist/MiSTer-Companion-macOS-${{ matrix.package_arch }}.dmg"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiSTer-Companion-macOS-${{ matrix.package_arch }}
          path: mister-companion/dist/MiSTer-Companion-macOS-${{ matrix.package_arch }}.dmg


  # ============================================================
  # Pre-release Creation
  # ============================================================
  release:
    name: Create / Update Pre-release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-linux
      - build-macos
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify Release Packages
        run: |
          ls -lh release-assets
          test -f release-assets/MiSTer-Companion-Windows-x86_64.zip
          test -f release-assets/MiSTer-Companion-Windows-ARM64.zip
          test -f release-assets/MiSTer-Companion-Linux-x86_64.tar.gz
          test -f release-assets/MiSTer-Companion-Linux-ARM64.tar.gz
          test -f release-assets/MiSTer-Companion-macOS-Apple-Silicon.dmg
          test -f release-assets/MiSTer-Companion-macOS-Intel.dmg

      - name: Update Git Tag
        run: |
          git tag -f Pre-release
          git push -f origin Pre-release

      - name: Create or Update Release
        uses: ncipollo/release-action@v1
        with:
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          tag: Pre-release
          artifacts: |
            release-assets/MiSTer-Companion-Windows-x86_64.zip
            release-assets/MiSTer-Companion-Windows-ARM64.zip
            release-assets/MiSTer-Companion-Linux-x86_64.tar.gz
            release-assets/MiSTer-Companion-Linux-ARM64.tar.gz
            release-assets/MiSTer-Companion-macOS-Apple-Silicon.dmg
            release-assets/MiSTer-Companion-macOS-Intel.dmg
